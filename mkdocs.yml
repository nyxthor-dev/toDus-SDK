site_name: ToDus SDK
site_description: Cliente Python para la plataforma de mensajería ToDus
site_author: nyxthor-dev
site_url: https://nyxthor-dev.github.io/toDus-API/
repo_url: https://github.com/nyxthor-dev/toDus-API
repo_name: toDus-API
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Modo claro
  font:
    text: Inter
    code: JetBrains Mono
  logo: material/message-text-outline
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: es
      separator: '[\s\-_.]+'
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            merge_init_into_class: true
            show_bases: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - footnotes
  - def_list

nav:
  - Inicio: index.md
  - Guías:
      - Instalación: installation.md
      - Inicio Rápido: quickstart.md
      - Cliente:
          - Visión General: client/overview.md
          - API de Mixins: client/mixins.md
      - Grupos: groups.md
      - Autenticación: authentication.md
      - Solución de Problemas: troubleshooting.md
  - Avanzado:
      - Event Bus y Filtros: events/overview.md
      - Cola Persistente:
          - Visión General: cache/overview.md
          - Cliente con Cola: cache/queue_client.md
      - Stanzas XML: stanzas/overview.md
      - Ejemplos: examples_advanced.md
  - Referencia API:
      - Parser: api/parser.md
      - Utilidades: api/utils.md
      - Tipos y Constantes: api/types_constants.md
      - Errores: api/errors.md
  - Contribuir: contributing.md
  - Changelog: changelog.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nyxthor-dev/toDus-API
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/todus-sdk/
      name: PyPI
  copyright: MIT License