name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]" pytest-json-report

      - name: Lint (flake8)
        run: flake8 todus/ --max-line-length=120 --count

      - name: Run tests
        run: pytest tests/ -v --json-report --json-report-file=report.json --tb=short 2>&1 | tee test_output.txt

      - name: Generate summary
        if: always()
        run: |
          cat > /tmp/gen_summary.py << 'PYEOF'
          import datetime
          import json
          import os

          if not os.path.exists('report.json'):
              with open('.github/test-report.md', 'w') as f:
                  f.write('# Test Report\n\nNo se genero report.json '
                          '(la ejecucion de pytest fallo antes de completarse).\n')
              raise SystemExit(0)

          with open('report.json') as f:
              data = json.load(f)

          tests = data.get('tests', [])
          passed = [t for t in tests if t.get('outcome') == 'passed']
          failed = [t for t in tests if t.get('outcome') == 'failed']
          errors = [t for t in tests if t.get('outcome') == 'error']
          duration = data.get('duration', 0)
          now = datetime.datetime.now(datetime.UTC).strftime('%Y-%m-%d %H:%M UTC')

          lines = []
          lines.append('# Test Report')
          lines.append('')
          lines.append('- **Fecha**: ' + now)
          lines.append('- **Total**: ' + str(len(tests)))
          lines.append('- **Passed**: ' + str(len(passed)))
          lines.append('- **Failed**: ' + str(len(failed)))
          lines.append('- **Errors**: ' + str(len(errors)))
          lines.append('- **Duration**: ' + '{:.2f}s'.format(duration))
          lines.append('')

          if failed:
              lines.append('## Failed')
              for t in failed:
                  node = t.get('nodeid', 'unknown')
                  msg = t.get('call', {}).get('crash', {}).get('message', '')
                  lines.append('- `' + node + '`')
                  if msg:
                      lines.append('  ```')
                      lines.append('  ' + msg.strip()[:300])
                      lines.append('  ```')
              lines.append('')

          if errors:
              lines.append('## Errors')
              for t in errors:
                  node = t.get('nodeid', 'unknown')
                  lines.append('- `' + node + '`')
              lines.append('')

          lines.append('## Passed')
          lines.append('')
          for t in passed:
              node = t.get('nodeid', 'unknown')
              dur = t.get('duration', 0)
              lines.append('- `' + node + '` ({:.3f}s)'.format(dur))

          with open('.github/test-report.md', 'w') as f:
              f.write('\n'.join(lines))
          PYEOF
          python /tmp/gen_summary.py

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: .github/test-report.md
