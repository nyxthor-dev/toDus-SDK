name: Create Release

on:
  push:
    branches: [main]
    paths:
      - 'todus/__init__.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e .

      - name: Extract version
        id: version
        run: |
          VERSION=$(python -c "from todus import __version__; print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ steps.version.outputs.version }}")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog section
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 -c "
          import re, os
          version = os.environ['VERSION']
          with open('CHANGELOG.md') as f:
              content = f.read()
          lines = content.split('\n')
          capture = False
          section_lines = []
          for line in lines:
              if line.startswith(f'## [{version}]'):
                  capture = True
                  continue
              if capture:
                  if line.startswith('## '):
                      break
                  if line.strip() == '---' and not section_lines:
                      continue
                  section_lines.append(line)
          body = '\n'.join(section_lines).strip()
          if body.endswith('---'):
              body = body[:-3].strip()
          with open('.github/release-body.md', 'w') as f:
              f.write(body)
          "
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: .github/release-body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Skip release
        if: steps.check.outputs.exists == 'true'
        run: echo "Release v${{ steps.version.outputs.version }} already exists, skipping"
